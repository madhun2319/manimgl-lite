name: Render Media Pipeline

on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene module to render (e.g., instagram_loop, prism_optics_scene)'
        required: true
        default: 'instagram_loop'
      format:
        description: 'Output format (gif or mp4)'
        required: true
        default: 'gif'
        type: choice
        options:
          - gif
          - mp4

jobs:
  render-animation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Tectonic)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Install Tectonic for LaTeX compilation if needed
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skia-python numpy PyMuPDF imageio Pillow

      - name: Execute Headless Dispatcher
        run: |
          python headless_dispatch.py --scene ${{ github.event.inputs.scene }} --format ${{ github.event.inputs.format }}

      - name: Upload Rendered Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.inputs.scene }}-render
          path: '*.${{ github.event.inputs.format }}'
          retention-days: 7
