name: Render Media Pipeline

on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Scene module to render (e.g., instagram_loop, prism_optics_scene)'
        required: true
        default: 'instagram_loop'
      format:
        description: 'Output format (gif or mp4)'
        required: true
        default: 'gif'
        type: choice
        options:
          - gif
          - mp4

jobs:
  render-animation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Tectonic)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libegl1
          # Install Tectonic for LaTeX compilation if needed
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skia-python numpy PyMuPDF imageio Pillow gTTS

      - name: Execute Headless Dispatcher
        run: |
          python headless_dispatch.py --scene ${{ github.event.inputs.scene }} --format ${{ github.event.inputs.format }}

      - name: Commit Media to Repository
        run: |
          mkdir -p outputs
          mv *.${{ github.event.inputs.format }} outputs/
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(media): auto-generate ${{ github.event.inputs.scene }} [skip ci]" && git push)
